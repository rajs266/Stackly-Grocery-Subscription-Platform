<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — Stackly</title>
  
  <link rel="icon" href="assets/top-logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white">
  
  <div id="global-preloader">
    <div class="loader-box">
      <div class="loader-box-face front"></div>
      <div class="loader-box-face back"></div>
      <div class="loader-box-face right"></div>
      <div class="loader-box-face left"></div>
      <div class="loader-box-face top"></div>
      <div class="loader-box-face bottom"></div>
    </div>
    <div class="loader-text">STACKLY</div>
  </div>

  <canvas id="three-canvas-bg"></canvas>

  <main class="d-flex align-items-center justify-content-center py-3 position-relative z-2" style="min-height: 100vh; box-sizing: border-box;">

    <div class="container" style="max-width: 700px;">
      <div class="card-3d p-4 p-md-5 text-center shadow-lg border-0 rounded-4 d-flex flex-column align-items-center justify-content-center" style="min-height: 520px; padding: 4rem 2rem !important;">
        
        <a href="index.html" class="d-inline-block mb-4" style="z-index: 5;">
          <img src="assets/logo.webp" alt="Stackly Logo" style="height: 65px; filter: drop-shadow(0 4px 10px rgba(255,255,255,0.6));">
        </a>

        <div class="glitch-wrapper mb-4" style="min-height: 150px; display: flex; align-items: center; justify-content: center;">
          <h1 class="fw-extrabold glitch-text m-0" data-text="404" style="font-size: 9rem; line-height: 1;">404</h1>
        </div>
        
        <h3 class="fw-bold mb-3 text-dark">Oops! Page Not Found</h3>
        <p class="text-muted small mb-4">
          The page you are looking for no longer exists or might have been moved. You can return back to the site's homepage or go back to your previous page.
        </p>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
          <a href="index.html" class="btn btn-get-started-shimmer btn-grow-shadow px-4 py-2.5 rounded-pill fw-bold text-decoration-none">
            <i class="fa-solid fa-house me-2"></i> Back to Home
          </a>
          <button onclick="window.history.back()" class="btn btn-outline-success px-4 py-2.5 rounded-pill fw-bold">
            <i class="fa-solid fa-arrow-left me-2"></i> Go Back
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
