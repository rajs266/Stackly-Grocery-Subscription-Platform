<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Stackly</title>
  <link rel="shortcut icon" href="assets/top-logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #020c05 0%, #041a0c 40%, #0a3018 70%, #0d3d1e 100%);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle  { position: absolute; border-radius: 50%; animation: floatUp linear infinite; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) scale(0.2); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Pulsing rings */
    .ring {
      position: fixed; border-radius: 50%;
      border: 1.5px solid rgba(34,197,94,0.1);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: pulseRing 7s ease-in-out infinite;
      pointer-events: none; z-index: 0;
    }
    .ring-1 { width: 440px; height: 440px; animation-delay: 0s; }
    .ring-2 { width: 680px; height: 680px; animation-delay: 2s; }
    .ring-3 { width: 920px; height: 920px; animation-delay: 4s; }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.1; transform: translate(-50%,-50%) scale(1); }
      50%       { opacity: 0.4; transform: translate(-50%,-50%) scale(1.05); }
    }

    /* Card wrapper - perfectly centered column */
    .card-404 {
      position: relative; z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      width: min(480px, 88vw);
      animation: fadeUp 0.85s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(50px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 2rem;
      animation: logoBounce 3s ease-in-out infinite;
    }
    .logo-wrap img {
      height: 50px;
      filter: drop-shadow(0 0 16px rgba(34,197,94,0.6));
      transition: transform 0.35s ease;
    }
    .logo-wrap:hover img { transform: scale(1.08); }
    @keyframes logoBounce {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-7px); }
    }

    /* 404 number */
    .num-404 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(7rem, 25vw, 11rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -5px;
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 45%, #a7f3d0 80%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glowPulse 3.5s ease-in-out infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(34,197,94,0.4)); }
      50%       { filter: drop-shadow(0 0 45px rgba(34,197,94,0.9)); }
    }

    /* Divider */
    .divider {
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, #4ade80, #22c55e, transparent);
      border-radius: 2px;
      margin-bottom: 1.25rem;
      animation: dividerPulse 2.5s ease-in-out infinite;
      align-self: stretch;
    }
    @keyframes dividerPulse {
      0%, 100% { opacity: 0.5; transform: scaleX(0.6); }
      50%       { opacity: 1;   transform: scaleX(1); }
    }

    /* Heading */
    .heading-404 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.3rem, 4.5vw, 1.75rem);
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.6rem;
      text-shadow: 0 2px 14px rgba(0,0,0,0.5);
    }

    /* Description */
    .desc-404 {
      color: rgba(255,255,255,0.55);
      font-size: 0.9rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    /* Buttons */
    .btn-row {
      display: flex; gap: 0.85rem;
      justify-content: center; flex-wrap: wrap;
      width: 100%;
    }
    .btn-home {
      flex: 1; min-width: 140px;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #16a34a, #059669);
      color: #fff; font-weight: 700; font-size: 0.92rem;
      border-radius: 50px; text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 6px 22px rgba(22,163,74,0.4);
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .btn-home:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 32px rgba(22,163,74,0.65);
      color: #fff;
    }
    .btn-back {
      flex: 1; min-width: 140px;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
      padding: 0.75rem 1.5rem;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.8); font-weight: 700; font-size: 0.92rem;
      border-radius: 50px; text-decoration: none;
      border: 1.5px solid rgba(255,255,255,0.2); cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .btn-back:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: rgba(74,222,128,0.6);
      color: #4ade80;
      box-shadow: 0 8px 22px rgba(0,0,0,0.3);
    }

    /* Bottom copyright line */
    .bottom-note {
      position: fixed; bottom: 1.25rem; left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 0.72rem; letter-spacing: 0.4px;
      z-index: 5;
    }

    @media (max-width: 420px) {
      .btn-row { flex-direction: column; }
      .btn-home, .btn-back { flex: unset; width: 100%; }
      .ring-2, .ring-3 { display: none; }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <div class="card-404">

    <!-- Logo centered at top -->
    <a href="index.html" class="logo-wrap" aria-label="Stackly Home">
      <img src="assets/logo.webp" alt="Stackly">
    </a>

    <!-- Giant 404 -->
    <div class="num-404">404</div>

    <!-- Animated divider -->
    <div class="divider"></div>

    <!-- Heading -->
    <h1 class="heading-404">Page Not Found</h1>

    <!-- Short description - no farm references -->
    <p class="desc-404">
      This page doesn't exist or has been removed.<br>
      Head back to explore our grocery subscription plans.
    </p>

    <!-- Two buttons -->
    <div class="btn-row">
      <a href="index.html" class="btn-home">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
      <button onclick="history.back()" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>

  </div>

  <!-- Bottom copyright -->
  <div class="bottom-note">&copy; 2026 Stackly Grocery Subscription Platform</div>

  <script>
    const wrap   = document.getElementById('particles');
    const colors = ['#22c55e','#4ade80','#86efac','#bbf7d0','#16a34a','#dcfce7'];
    const sizes  = [3, 4, 5, 6, 7, 8, 10];
    for (let i = 0; i < 50; i++) {
      const el  = document.createElement('div');
      el.className = 'particle';
      const s   = sizes[Math.floor(Math.random() * sizes.length)];
      const c   = colors[Math.floor(Math.random() * colors.length)];
      el.style.cssText = `
        width:${s}px; height:${s}px;
        background:${c};
        left:${Math.random()*100}%;
        bottom:-8%;
        animation-duration:${10 + Math.random()*12}s;
        animation-delay:-${Math.random()*16}s;
        box-shadow:0 0 ${s*2}px ${c};
        opacity:0;
      `;
      wrap.appendChild(el);
    }
  </script>

</body>
</html>
